name: check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a pull request: links must resolve, and the generated navigation
      # must not be hand-edited. The navigation is generated by the bot after
      # merge (the "push" step below), so a PR only carries its page files.
      - name: Check links and reject hand-edited navigation
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/build_wiki.py
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/pr-files.txt

          # Generated by scripts/build_wiki.py and rebuilt by the bot after
          # merge. A PR must not touch them (README's INDEX block is generated too).
          if grep -Eq '^(_Sidebar\.md|Category-.*\.md|Tags\.md|Tag-.*\.md|README\.md)$' /tmp/pr-files.txt; then
            echo "::error::These files are generated by scripts/build_wiki.py and are rebuilt by the bot after merge. Remove them from the pull request:"
            grep -E '^(_Sidebar\.md|Category-.*\.md|Tags\.md|Tag-.*\.md|README\.md)$' /tmp/pr-files.txt | sed 's/^/    /'
            echo "::error::Fix: for each file run  git checkout origin/main -- <file>  (or  git rm <file>  if it is new), then commit."
            exit 1
          fi

          # A PR that rewrites a page already on main signals a stale branch
          # or a page copied from another PR. Warn (don't fail) so a reviewer notices.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.md' \
             | while read -r f; do git cat-file -e "origin/${{ github.base_ref }}:$f" 2>/dev/null && echo "$f"; done \
             | grep -q .; then
            echo "::warning::This PR changes page(s) that already exist on main (stale branch, or a page copied from another PR). Rebase on main and keep only your new page."
          fi

      # On main: regenerate the navigation and commit it, so the Home index,
      # sidebar, category and tag pages always match the pages on main.
      - name: Regenerate and commit navigation on main
        if: github.event_name == 'push'
        run: |
          python3 scripts/build_wiki.py
          if ! git diff --exit-code --quiet; then
            git config user.name "wiki-bot"
            git config user.email "wiki-bot@hal9.ai"
            git add -A
            git commit -m "chore: regenerate navigation"
            git push origin HEAD:refs/heads/main
          fi
