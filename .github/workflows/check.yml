name: check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a pull request: links must resolve, and the generated navigation
      # must not be hand-edited. The navigation is generated by the bot after
      # merge (the "push" step below), so a PR only carries its page files.
      - name: Check links and reject hand-edited navigation
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/build_wiki.py
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -Eq '^(_Sidebar\.md|Category-.*\.md|Tags\.md|Tag-.*\.md)$'; then
            echo "::error::These files are generated by scripts/build_wiki.py; the bot regenerates them after merge. Remove them from the pull request."
            exit 1
          fi

      # On main: regenerate the navigation and commit it, so the Home index,
      # sidebar, category and tag pages always match the pages on main.
      - name: Regenerate and commit navigation on main
        if: github.event_name == 'push'
        run: |
          python3 scripts/build_wiki.py
          if ! git diff --exit-code --quiet; then
            git config user.name "wiki-bot"
            git config user.email "wiki-bot@hal9.ai"
            git add -A
            git commit -m "chore: regenerate navigation"
            git push origin HEAD:refs/heads/main
          fi
